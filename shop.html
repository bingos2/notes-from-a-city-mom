<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop | Notes from a City Mom</title>
  <meta name="description" content="Browse digital keepsakes and tools from Notes from a City Mom.">
  <link rel="canonical" href="https://www.citymomnotes.com/shop">
  <link rel="stylesheet" href="/inside.css">
  <style>
    .catalog{padding:28px 0 60px;color:#071b3d}
    .catalog h1{font:700 clamp(38px,6vw,60px)/1 Fredoka,Arial,sans-serif;margin:0 0 20px}
    .catalog-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),330px));gap:16px;margin:0;padding:0;list-style:none}
    .catalog-card{display:block;height:100%;color:#071b3d;text-decoration:none;background:#fffdf8;border:1px solid #e8d9bb;border-radius:18px;overflow:hidden}
    .catalog-card:focus-visible{outline:3px solid #185496;outline-offset:4px}
    .catalog-cover{display:grid;place-items:center;background:#fbefd8;padding:16px;height:223px}
    .catalog-cover img{max-width:100%;height:100%;width:auto;max-height:191px;display:block;border-radius:5px;box-shadow:0 5px 12px #3c271320}
    .catalog-body{padding:16px 17px 18px}
    .catalog-body h2{font:700 clamp(22px,5.5vw,27px)/1.1 Fredoka,Arial,sans-serif;margin:0 0 7px}
    .catalog-body p{margin:0 0 9px;line-height:1.4}
    .catalog-price{font-weight:900}.catalog-action{display:inline-block;padding:7px 10px;border-radius:7px;background:#ffcc32;font-weight:900;margin-top:2px}
    .catalog-card:hover .catalog-action{background:#ffe483}
    @media(max-width:480px){.inside-top{height:auto!important;min-height:66px;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding-block:10px}.inside-nav{gap:12px!important}}
  </style>
</head>
<body>
<header class="inside-wrap inside-top">
  <a class="inside-logo" href="/">Notes from a City Mom<span class="spark" aria-hidden="true"></span></a>
  <nav class="inside-nav" aria-label="Main"><a href="/newsletters">Newsletter</a><a href="/watch">Videos</a><a href="/tools">Tools</a><a href="/shop" aria-current="page">Shop</a></nav>
</header>
<main class="inside-wrap catalog">
  <h1>Shop</h1>
  <ul class="catalog-list" aria-label="Products">
    <li><a class="catalog-card" href="/shop/baby-memory-book">
      <div class="catalog-cover"><img src="/assets/journal-shop/cover.webp" width="520" height="673" alt="Illustrated cover of My Baby’s Little Days"></div>
      <div class="catalog-body"><h2>My Baby’s Little Days</h2><p>Make a printable baby memory book in your browser.</p><p class="catalog-price">$9.90 USD</p><span class="catalog-action">View the baby book →</span></div>
    </a></li>
  </ul>
</main>
</body>
</html>
