<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notes from a City Mom</title><meta name="description" content="Real-life help for life with little ones.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#071b3d;--cream:#fffaf0;--yellow:#ffcc32;--blue:#dceefa;--green:#e0f0df;--butter:#fff0bb}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:Nunito,Arial,sans-serif}.wrap{width:min(1088px,calc(100% - 40px));margin:auto}
    .top{height:93px;display:flex;align-items:center;justify-content:space-between}.logo{color:var(--navy);font:700 28px/1 Fredoka,sans-serif;text-decoration:none;letter-spacing:-1.1px}.spark{display:inline-block;width:18px;height:18px;margin-left:4px;vertical-align:3px;background:repeating-conic-gradient(from 5deg,transparent 0 14deg,var(--yellow) 15deg 19deg,transparent 20deg 45deg);border-radius:50%}.nav{display:flex;gap:38px}.nav a{color:var(--navy);text-decoration:none;font-size:16px;font-weight:800}
    .hero{padding:8px 0 18px}.hero-grid{display:grid;grid-template-columns:minmax(0,52%) minmax(0,48%);min-height:393px;overflow:hidden}.hero-copy{min-width:0}.hero-art{min-width:0}.hero-copy{padding:43px 0 20px;position:relative;z-index:1}.hero h1{margin:0;max-width:505px;font:700 clamp(53px,5.3vw,68px)/.99 Fredoka,sans-serif;letter-spacing:-2.4px}.brush{display:inline;white-space:nowrap;background:linear-gradient(transparent 77%,var(--yellow) 0 95%,transparent 0);padding:0 3px}.hero p{margin:18px 0 0;font-size:19px;line-height:1.3;font-weight:700}.hero-art{height:393px;overflow:hidden;position:relative;background:#f4e7cf}.hero-art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--cream) 0,rgba(255,250,240,.42) 8%,transparent 24%)}.hero-art img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
    .doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 0 34px}.door{min-height:125px;display:grid;grid-template-columns:100px 1fr;align-items:center;border-radius:19px;padding:18px;color:var(--navy);text-decoration:none}.door:nth-child(1){background:var(--butter)}.door:nth-child(2){background:var(--blue)}.door:nth-child(3){background:var(--green)}.door h2{margin:0 0 4px;font:700 29px/1 Fredoka,sans-serif;letter-spacing:-1px}.door p{margin:0;font-size:15px;font-weight:700}.icon{width:67px;height:60px;position:relative;transform:rotate(-6deg)}.icon:before{content:"";position:absolute;inset:4px 8px 7px;border:4px solid var(--navy);border-radius:9px;background:#fffdf8}.icon b{position:absolute;right:0;top:0;width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:-11px 7px 0 -2px var(--yellow),-17px -2px 0 -3px var(--yellow)}.newsletter .icon:after{content:"♥";position:absolute;left:25px;top:18px;color:#f0726f;font-size:18px}.videos .icon:before{border-radius:12px;background:#ffeae7}.videos .icon:after{content:"▶";position:absolute;left:31px;top:18px;color:#f0726f;font-size:21px}.tools .icon:after{content:"✓\A✓\A✓";white-space:pre;position:absolute;left:22px;top:9px;color:#23a9a5;font:800 19px/18px Arial}
    .latest{padding:0 0 68px}.latest h2{margin:0 0 14px;font:700 43px/1 Fredoka,sans-serif;letter-spacing:-1.5px}.latest h2 .spark{width:19px;height:19px}.latest-grid{display:grid;grid-template-columns:680px 264px;gap:18px;align-items:start}.video{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;border-radius:16px;background:var(--blue);color:white;text-decoration:none}.video.ig{aspect-ratio:1/1.14;background:var(--butter)}.video img{position:absolute;width:100%;height:100%;object-fit:cover;filter:brightness(.96)}.tag{position:absolute;z-index:2;top:14px;left:14px;padding:8px 13px;border-radius:999px;background:var(--navy);font-size:13px;font-weight:800}.play{position:absolute;z-index:2;left:50%;top:50%;width:65px;height:65px;transform:translate(-50%,-50%);display:grid;place-items:center;padding-left:4px;border:3px solid #fff;border-radius:50%;background:rgba(7,27,61,.25);font-size:25px}.empty{height:100%;display:grid;place-items:center;padding:30px;color:#536a7e;text-align:center;font-weight:800}.foot{border-top:1px solid #eee5d7;padding:26px 0;color:#637486;font-size:13px}.foot-row{display:flex;justify-content:space-between}.foot a{margin-left:18px;color:inherit;text-decoration:none}
    @media(max-width:1100px){.latest-grid{grid-template-columns:minmax(0,1fr) 250px}}@media(max-width:720px){.wrap{width:min(100% - 32px,520px)}.top{height:70px}.logo{font-size:21px}.spark{width:14px;height:14px;vertical-align:2px}.nav{gap:16px}.nav a{font-size:13px}.hero{padding-top:10px}.hero-grid{display:flex;flex-direction:column;min-height:0}.hero-copy{width:100%;padding:22px 0 18px}.hero h1{font-size:49px;letter-spacing:-2px}.hero p{font-size:16px;margin-top:14px}.hero-art{width:100%;height:290px}.doors{grid-template-columns:1fr;gap:10px;padding-bottom:33px}.door{min-height:105px;grid-template-columns:94px 1fr;border-radius:17px}.door h2{font-size:27px}.latest h2{font-size:37px}.latest-grid{grid-template-columns:1fr;gap:12px}.video{width:100%;aspect-ratio:16/9}.video.ig{display:none}.foot-row{display:block}.foot nav{margin-top:10px}.foot a:first-child{margin-left:0}}
  .video{border:0;cursor:pointer;font:inherit;text-align:left}.video:active{transform:scale(.985)}.modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:20px;background:rgba(7,27,61,.76)}.modal.open{display:grid}.modal-box{position:relative;width:min(900px,100%);background:#071b3d;border-radius:18px;padding:42px 18px 18px}.modal iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}.modal.instagram .modal-box{width:min(430px,100%)}.modal.instagram iframe{aspect-ratio:9/16}.modal-close{position:absolute;right:10px;top:8px;border:0;background:transparent;color:white;font-size:28px;cursor:pointer}</style>
</head>
<body>
  <header class="wrap top"><a class="logo" href="/">Notes from a City Mom<span class="spark" aria-hidden="true"></span></a><nav class="nav"><a href="/newsletters">Newsletter</a><a href="/watch">Videos</a><a href="/tools">Tools</a></nav></header>
  <main>
    <section class="hero"><div class="wrap hero-grid"><div class="hero-copy"><h1>Real-life help<br>for life with<br><span class="brush">little ones.</span></h1><p>Warm notes, practical videos,<br>and simple tools.</p></div><div class="hero-art"><img src="/assets/hero-home.jpg" alt="A mother and toddler reading together"></div></div></section>
    <section class="wrap doors"><a class="door newsletter" href="/newsletters"><span class="icon"><b></b></span><span><h2>Newsletter</h2><p>A note for you.</p></span></a><a class="door videos" href="/watch"><span class="icon"><b></b></span><span><h2>Videos</h2><p>YouTube &amp; Instagram.</p></span></a><a class="door tools" href="/tools"><span class="icon"><b></b></span><span><h2>Tools</h2><p>Guides &amp; printables.</p></span></a></section>
    <section class="wrap latest"><h2>Latest videos <span class="spark" aria-hidden="true"></span></h2><div class="latest-grid"><button class="video js-play" type="button" data-video="youtube" aria-label="Play latest YouTube video"><span class="tag">Latest on YouTube</span><img src="https://i.ytimg.com/vi/a8C1xqg7SF8/maxresdefault.jpg" alt="Latest Notes from a City Mom YouTube video"><span class="play" aria-hidden="true">▶</span></button><button class="video ig js-play" type="button" data-video="instagram" aria-label="Play latest Instagram reel"><span class="tag">Latest on Instagram</span><img src="/assets/latest-instagram-reel.jpg" alt="Latest Notes from a City Mom Instagram reel"><span class="play" aria-hidden="true">▶</span></button></div></section>
  </main>
  <footer class="foot"><div class="wrap foot-row"><span>© Notes from a City Mom</span><nav><a href="/about">About</a><a href="/privacy">Privacy</a></nav></div></footer>
<div class="modal" id="video-modal" role="dialog" aria-modal="true" aria-label="Video player"><div class="modal-box"><button class="modal-close" type="button" aria-label="Close video">×</button><iframe id="video-frame" title="Video player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div><script>const modal=document.querySelector('#video-modal'),frame=document.querySelector('#video-frame');document.querySelectorAll('.js-play').forEach(b=>b.addEventListener('click',()=>{const isIg=b.dataset.video==='instagram';modal.classList.toggle('instagram',isIg);frame.src=isIg?'https://www.instagram.com/reel/Dewm1RhJcFG/embed':'https://www.youtube-nocookie.com/embed/a8C1xqg7SF8?autoplay=1';modal.classList.add('open')}));function closeVideo(){modal.classList.remove('open');frame.src=''}document.querySelector('.modal-close').onclick=closeVideo;modal.addEventListener('click',e=>{if(e.target===modal)closeVideo()})</script></body></html>
